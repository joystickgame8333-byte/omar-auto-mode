name: Build Omar Auto Mode rootless deb

on:
  workflow_dispatch:
  push:
    paths:
      - "projects/omar-auto-mode-real/**"
      - ".github/workflows/omar-auto-mode-build-rootless.yml"

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: projects/omar-auto-mode-real
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          brew install ldid xz make
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build
        run: |
          make clean package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OmarAutoMode-rootless
          path: projects/omar-auto-mode-real/packages/*.deb
